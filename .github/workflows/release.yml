name: Release

# The extension is open source (public repository, owner 2026-11-13) and is distributed as a
# GitHub release of this repository; sudemi.com/downloads serves the latest release zip to shops.
#
# Push a tag v<version> (for example v1.2.3). The tag must equal the extension version
# (install.json and Client::VERSION) and CHANGELOG.md must have a "## <version>" entry, or the
# release fails. The zip is what OpenCart 4 expects under Extensions > Installer: install.json,
# admin/, catalog/ and system/ at the root of a file named sudemi.ocmod.zip (OpenCart takes the
# extension code, sudemi, from the file name, so the name carries no version). Files marked
# export-ignore in .gitattributes (tests, CI, developer docs) are left out.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # GitHub-hosted runner: the repository is public, so a self-hosted runner would let a pull
    # request from a fork run code on sudemi's server; hosted minutes are free for public
    # repositories. PHP runs in a php:8.3-cli container (sodium built in).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the extension version
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"; exit 1; }
          manifest="$(jq -r .version install.json)"
          client="$(sed -nE "s/^[[:space:]]*const VERSION = '([^']+)';.*/\1/p" system/library/sudemi/client.php)"
          echo "tag $v, install.json $manifest, Client::VERSION $client"
          [ "$manifest" = "$v" ] && [ "$client" = "$v" ] || { echo "tag and extension version differ"; exit 1; }
          grep -Eq "^## $v( |\$)" CHANGELOG.md || { echo "CHANGELOG.md has no entry ## $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Lint and tests
        run: |
          docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c \
            'find . -name "*.php" -print0 | xargs -0 -n1 php -l && for t in tests/*-test.php; do php "$t" || exit 1; done'

      - name: Build the zip
        run: |
          set -eu
          zip="sudemi.ocmod.zip"
          git archive --format=zip -o "$zip" HEAD
          python3 -c 'import sys, zipfile; print("\n".join(zipfile.ZipFile(sys.argv[1]).namelist()))' "$zip" > files.txt
          grep -qx 'install.json' files.txt || { echo "install.json not at the zip root"; exit 1; }
          grep -q '^admin/controller/' files.txt || { echo "admin/ missing"; exit 1; }
          grep -Eq '^(tests|\.github)/|\.git(ignore|attributes)$' files.txt && { echo "dev files in the zip"; exit 1; } || true
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"; ls -l "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          printf '\nInstall: OpenCart 4 admin, Extensions > Installer > Upload, choose %s (keep that file name), then install sudemi under Extensions > Extensions > Modules.\n' "$ZIP" >> notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "sudemi extension for OpenCart 4 $VERSION" --notes-file notes.md
